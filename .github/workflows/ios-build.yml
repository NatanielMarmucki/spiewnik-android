name: iOS build

# Runs on pull requests and on demand. macOS runner minutes are billed at ten times the rate,
# but the repository is public, so the minutes are free.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the iOS app for the simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-spiewnik-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-spiewnik-

      - name: Get packages
        run: flutter pub get

      # No signing certificate on the runner, so only the simulator build.
      - name: Build for the simulator
        run: flutter build ios --simulator --no-codesign
